app:
  name: Aladdin Copilot｜兼容性测试 Workflow 20261003
  mode: workflow
  icon: 🤖
  icon_background: '#E4FBCC'
  description: Dify Copilot project
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    speech_to_text:
      enabled: false
    text_to_speech:
      enabled: false
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
  graph:
    nodes:
      - id: start
        type: custom
        position:
          x: 0
          y: 0
        sourcePosition: right
        targetPosition: left
        data:
          type: start
          title: 开始
          selected: false
          variables:
            - variable: input
              label: 输入
              type: text-input
              required: true
              max_length: 256
              options: []
      - id: finish
        type: custom
        position:
          x: 300
          y: 0
        sourcePosition: right
        targetPosition: left
        data:
          type: end
          title: 结束
          outputs:
            - variable: result
              value_selector:
                - start
                - input
          selected: false
    edges:
      - id: start-finish
        type: custom
        source: start
        sourceHandle: source
        target: finish
        targetHandle: target
        data:
          sourceType: start
          targetType: end
          isInIteration: false
          isInLoop: false
